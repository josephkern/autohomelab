# vLLM image REGISTRY — the curated menu of validated images runbooks pin FROM.
#
# Reproducibility model (project rule #1): the AUTHORITATIVE pin lives in each
# runbook's `VLLM_IMAGE` (by digest), exactly like the hand-written serve scripts.
# Image VERSION is a per-model compatibility/tuning dimension — different models
# and experiments legitimately need different images (e.g. NVFP4 main-MoE needs
# marlin on sm_121, but an unquantized MTP MoE needs a nested triton backend only
# present in a newer image). This file is the catalog + the default for new
# baselines; it does NOT force one global image.
#
# Sourced by adapter.sh (for the default) and read by gen_baseline.py.

# Default image for freshly generated baselines (stable release, pinned by digest).
# NOTE: pin the LOCAL RepoDigest (the multi-arch index digest from `docker inspect`), which
# resolves to the pulled local image — NOT the per-arch digest from `docker manifest inspect`.
AHL_VLLM_DEFAULT_IMAGE="vllm/vllm-openai@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f"  # v0.24.0
AHL_VLLM_DEFAULT_ENTRYPOINT_SERVE=true   # image ENTRYPOINT is already `vllm serve` -> pass MODEL positionally

