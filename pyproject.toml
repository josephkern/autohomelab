[project]
name = "autohomelab"
version = "0.1.0"
description = "Portable LLM-serving benchmark + autotuner for NVIDIA hardware (tok/s as the metric)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "guidellm",          # benchmark driver — exact version pinned in uv.lock
    "huggingface-hub",   # model downloads (also used via `uvx hf`)
]

# Exact versions are pinned in uv.lock (project rule: reproducibility first).
# Helper scripts use this env via `uv run`; system scripts stay in bash.

[tool.uv]
package = false
